<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Управление бронированием экскурсий</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .booking-card {
            border-left: 4px solid;
        }
        .booking-card.active {
            border-left-color: #198754;
        }
        .booking-card.inactive {
            border-left-color: #ffc107;
        }
    </style>
</head>
<body>

<!-- Навигационная панель (navbar) -->
<div th:insert="~{navbar.html}" class="navbar-custom"></div>

<div class="container mt-4">
    <h1 class="mb-4"><i class="bi bi-calendar-check me-2"></i>Бронирование экскурсий</h1>

    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">Список бронирований</h5>
            <div class="mt-2">
                <span class="badge bg-primary">Всего: <span th:text="${bookings.size()}"></span></span>
                <span class="badge bg-success ms-2">Подтверждено: <span th:text="${activeCount}"></span></span>
            </div>
        </div>

        <div class="card-body">
            <div th:if="${bookings == null or bookings.isEmpty()}" class="alert alert-info">
                Нет активных бронирований
            </div>

            <div th:each="booking : ${bookings}" class="card mb-3 booking-card"
                 th:classappend="${booking.active} ? 'active' : 'inactive'">
                <div class="card-body">
                    <h5 th:text="${booking.tour.title}">Название тура</h5>
                    <p class="text-muted">
                        <i class="bi bi-calendar-date me-2"></i>
                        <span th:text="${#temporals.format(booking.bookingTime, 'dd.MM.yyyy HH:mm')}"></span>
                    </p>

                    <div class="mb-2">
                        <i class="bi bi-person me-2"></i>
                        <span th:text="${booking.user.name}"></span>
                    </div>
                    <div class="mb-2">
                        <i class="bi bi-person-vcard me-2"></i>
                        <span th:text="${booking.user.email}"></span>
                    </div>
                    <div class="mb-2">
                        <i class="bi bi-telephone me-2"></i>
                        <span th:text="${booking.user.phone}"></span>
                    </div>

                    <div class="mb-3" th:if="${booking.description}">
                        <i class="bi bi-chat-left-text me-2"></i>
                        <span th:text="${booking.description}"></span>
                    </div>

                    <div class="d-flex justify-content-end">
                        <button th:data-id="${booking.id}"
                                class="btn btn-sm me-2 toggle-active-btn"
                                th:classappend="${booking.active} ? 'btn-warning' : 'btn-success'">
                            <span th:text="${booking.active} ? 'Отменить' : 'Подтвердить'"></span>
                        </button>

                        <a th:href="@{/admin/booking/edit/{id}(id=${booking.id})}"
                           class="btn btn-sm btn-primary me-2">
                            <i class="bi bi-pencil"></i> Редактировать
                        </a>

                        <button th:data-id="${booking.id}"
                                class="btn btn-sm btn-danger delete-btn">
                            <i class="bi bi-trash"></i> Удалить
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        console.log("DOM fully loaded");

        // Получаем CSRF токен
        const token = document.querySelector('meta[name="_csrf"]').content;
        const headerName = document.querySelector('meta[name="_csrf_header"]').content;

        // Обработчики для всех кнопок
        document.querySelectorAll('.toggle-active-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const bookingId = this.getAttribute('data-id');
                console.log("Button clicked for feedback ID:", bookingId);

                fetch(`/admin/booking/${bookingId}/changeActive`, {
                    method: 'POST',
                    headers: {
                        [headerName]: token,
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        console.log("Success, reloading page");
                        window.location.reload();
                    })
                    .catch(error => {
                        console.error("Error:", error);
                        alert('Ошибка: ' + error.message);
                    });
            });
        });

        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const bookingId = this.getAttribute('data-id');
                console.log("Button clicked for feedback ID:", bookingId);

                fetch(`/admin/booking/${bookingId}/delete`, {
                    method: 'POST',
                    headers: {
                        [headerName]: token,
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        console.log("Success, reloading page");
                        window.location.reload();
                    })
                    .catch(error => {
                        console.error("Error:", error);
                        alert('Ошибка: ' + error.message);
                    });
            });
        });
    });
</script>

</body>
</html>
