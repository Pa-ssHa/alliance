<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактирование бронирования | Админ-панель</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .booking-card {
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            border: none;
        }
        .form-section {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .info-badge {
            font-size: 0.9rem;
            padding: 0.35em 0.65em;
        }
    </style>
</head>
<body>
<div class="container py-4">
    <div th:insert="~{navbar.html}"></div>

    <div class="card booking-card p-4 mb-4">
        <!-- Хлебные крошки -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/admin-panel}">Админ-панель</a></li>
                <li class="breadcrumb-item"><a th:href="@{/admin/booking-coursework}">Бронирования</a></li>
            </ol>
        </nav>

        <!-- Информация о бронировании -->
        <div class="mb-4">
            <div class="d-flex justify-content-between align-items-start mb-3">
                <h2 class="mb-0" th:text="${upBookingCoursework.get().getCoursework().title}"></h2>
                <span class="badge bg-success fs-6" th:text="${upBookingCoursework.get().getCoursework().price + ' руб.'}"></span>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title"><i class="bi bi-person-badge"></i> Информация о клиенте</h5>
                            <div class="mb-2">
                                <span class="fw-bold">ФИО:</span>
                                <span th:text="${upBookingCoursework.get().user.name}"></span>
                            </div>
                            <div class="mb-2">
                                <span class="fw-bold">Телефон:</span>
                                <span th:text="${upBookingCoursework.get().user.phone}"></span>
                            </div>
                            <div th:if="${upBookingCoursework.get().user.email != null}">
                                <span class="fw-bold">Email:</span>
                                <span th:text="${upBookingCoursework.get().user.email}"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title"><i class="bi bi-calendar-check"></i> Текущее бронирование</h5>
                            <div th:if="${upBookingCoursework.get().description != null && !upBookingCoursework.get().description.isEmpty()}">
                                <span class="fw-bold">Примечание:</span>
                                <span th:text="${upBookingCoursework.get().description}"></span>
                            </div>
                            <div>
                                <span class="fw-bold">Статус:</span>
                                <span th:if="${upBookingCoursework.get().active}" class="badge bg-success info-badge">Активно</span>
                                <span th:unless="${upBookingCoursework.get().active}" class="badge bg-secondary info-badge">Неактивно</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Форма редактирования -->
        <form th:action="@{/admin/booking-coursework/edit/{bookingId}(bookingId=${upBookingCoursework.get().id})}" method="post" onsubmit="saveScrollPosition()">
            <input type="hidden" id="scrollPosition" name="scrollPosition" value="">

            <!-- Блок редактирования описания -->
            <div class="form-section">
                <h4 class="mb-3"><i class="bi bi-pencil-square me-2"></i> Редактировать примечание</h4>
                <div class="mb-3">
                    <label for="description" class="form-label">Примечание к бронированию</label>
                    <textarea id="description" name="description" class="form-control" rows="3"
                              th:text="${upBookingCoursework.get().description}"
                              placeholder="Дополнительная информация..."></textarea>
                    <div class="form-text">Максимум 500 символов</div>
                </div>
            </div>

            <!-- Кнопки формы -->
            <div class="d-flex justify-content-between mt-4">
                <a th:href="@{/admin/booking-coursework}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-2"></i>Вернуться к списку
                </a>
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check-circle me-2"></i>Сохранить все изменения
                </button>
            </div>
        </form>

        <!-- Сообщение об ошибке -->
        <div th:if="${error}" class="alert alert-danger mt-3">
            <i class="bi bi-exclamation-octagon-fill me-2"></i>
            <span th:text="${error}"></span>
        </div>
    </div>
</div>

<!-- Подключение Flatpickr -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>

<div th:insert="~{savingPosition.html}"></div>
