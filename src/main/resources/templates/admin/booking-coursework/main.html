<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Запросы на консультации</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .booking-card {
            border-left: 4px solid;
            transition: all 0.2s ease;
        }
        .booking-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .booking-card.active {
            border-left-color: #198754;
        }
        .booking-card.inactive {
            border-left-color: #ffc107;
        }
        .booking-card.expired {
            border-left-color: #dc3545;
            opacity: 0.8;
        }
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }
        .badge-container {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .user-info {
            background-color: #f8f9fa;
            padding: 0.75rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
        }
        .expired-badge {
            background-color: #dc3545;
            color: white;
        }
        @media (max-width: 768px) {
            .header-actions {
                flex-direction: column;
                align-items: flex-start;
            }
            .action-buttons {
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>

<!-- Навигационная панель (navbar) -->
<div th:insert="~{navbar.html}" class="navbar-custom"></div>

<div class="container mt-4">
    <div class="header-actions">
        <h1 class="mb-0"><i class="bi bi-calendar-check me-2"></i>Бронирование экскурсий</h1>
        <div class="action-buttons">
            <a href="/admin-panel" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Назад
            </a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <div class="d-flex justify-content-between align-items-center flex-wrap">
                <h5 class="mb-0"><i class="bi bi-list-ul me-2"></i>Список бронирований</h5>
                <div class="badge-container mt-2 mt-md-0">
                    <span class="badge bg-primary">Всего: <span id="totalCount" th:text="${bookingCoursework.size()}"></span></span>
                    <span class="badge bg-success">Подтверждено: <span id="activeCount" th:text="${activeCount}"></span></span>
                </div>
            </div>
        </div>

        <div class="card-body">
            <div th:if="${bookingCoursework == null or bookingCoursework.isEmpty()}" class="alert alert-info">
                <i class="bi bi-info-circle me-2"></i>Нет активных бронирований
            </div>
            <div th:each="booking : ${bookingCoursework}" class="card mb-3 booking-card"
                 th:classappend="${booking.active} ? 'active' : 'inactive'">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <h5 class="card-title" th:text="${booking.getCoursework().title}">Название тура</h5>
                        <span class="badge expired-badge mb-2 d-none">
                            <i class="bi bi-clock-history me-1"></i>Просрочено
                        </span>
                    </div>

                    <div class="user-info">
                        <div class="mb-2">
                            <i class="bi bi-person me-2"></i>
                            <span th:text="${booking.user.name}"></span>
                        </div>
                        <div class="mb-2">
                            <i class="bi bi-person-vcard me-2"></i>
                            <span th:text="${booking.user.email}"></span>
                        </div>
                        <div class="mb-0">
                            <i class="bi bi-telephone me-2"></i>
                            <span th:text="${booking.user.phone}"></span>
                        </div>
                    </div>

                    <div class="mb-3" th:if="${booking.description}">
                        <i class="bi bi-chat-left-text me-2"></i>
                        <span th:text="${booking.description}"></span>
                    </div>

                    <div class="d-flex justify-content-end flex-wrap gap-2">
                        <button th:data-id="${booking.id}"
                                class="btn btn-sm toggle-active-btn"
                                th:classappend="${booking.active} ? 'btn-warning' : 'btn-success'">
                            <i class="bi" th:classappend="${booking.active} ? 'bi-x-circle' : 'bi-check-circle'"></i>
                            <span th:text="${booking.active} ? ' Отменить' : ' Подтвердить'"></span>
                        </button>

                        <a th:href="@{/admin/booking-coursework/edit/{id}(id=${booking.id})}"
                           class="btn btn-sm btn-primary">
                            <i class="bi bi-pencil"></i> Редактировать
                        </a>

                        <button th:data-id="${booking.id}"
                                class="btn btn-sm btn-danger delete-btn">
                            <i class="bi bi-trash"></i> Удалить
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Получаем CSRF токен
        const token = document.querySelector('meta[name="_csrf"]').content;
        const headerName = document.querySelector('meta[name="_csrf_header"]').content;

        // Обработчики для кнопок изменения статуса
        document.querySelectorAll('.toggle-active-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                if (this.disabled) return;

                const bookingId = this.getAttribute('data-id');
                const action = this.textContent.trim();

                if (!confirm(`Вы уверены, что хотите ${action.toLowerCase()} это бронирование?`)) return;

                fetch(`/admin/booking-coursework/changeActive/${bookingId}`, {
                    method: 'POST',
                    headers: {
                        [headerName]: token,
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                })
                    .then(response => {
                        if (!response.ok) throw new Error('Network response was not ok');
                        window.location.reload();
                    })
                    .catch(error => {
                        console.error("Error:", error);
                        alert('Ошибка: ' + error.message);
                    });
            });
        });

        // Обработчики для кнопок удаления
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const bookingId = this.getAttribute('data-id');

                if (!confirm('Вы уверены, что хотите удалить это бронирование?')) return;

                fetch(`/admin/booking-coursework/delete/${bookingId}`, {
                    method: 'POST',
                    headers: {
                        [headerName]: token,
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                })
                    .then(response => {
                        if (!response.ok) throw new Error('Network response was not ok');
                        window.location.reload();
                    })
                    .catch(error => {
                        console.error("Error:", error);
                        alert('Ошибка: ' + error.message);
                    });
            });
        });
    });
</script>

</body>
</html>
