<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta charset="UTF-8">
    <title>Клиенты</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/styles.css">
</head>
<body>

<div th:replace="navbar.html"></div>

<h1>Список клиентов недвижимости</h1>

<table class="table">
    <thead>
    <tr>
        <th>Имя</th>
        <th>Телефон</th>
        <th>Описание</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="client : ${clients}">
        <td th:text="${client.name}"></td>
        <td th:text="${client.phone}"></td>
        <td th:text="${client.description}"></td>
        <td>
            <a th:href="@{/admin/client-realty/edit/{id}(id=${client.id})}" class="btn btn-warning">Редактировать</a>

            <form th:method="DELETE" th:action="@{/admin/client-realty/delete/{id}(id=${client.id})}" style="display: inline;"
                  onsubmit="return confirm('Вы уверены, что хотите удалить этого клиента?');">
                <button type="submit" class="btn btn-danger">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<a th:href="@{/admin/client-realty/new}" class="btn btn-primary">Добавить нового клиента</a>

</body>
</html>
