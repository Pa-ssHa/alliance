<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <!--    CSRF    -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta charset="UTF-8">
    <title>Редактирование тура</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .img-thumbnail {
            position: relative;
            padding: 0;
            border: none;
            overflow: hidden;
        }
        .badge-main {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 123, 255, 0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="container py-4">

    <!-- Навигационная панель -->
    <div th:insert="~{navbar.html}"></div>

    <!-- Кнопка "Назад" -->
    <a th:href="@{/coursework/{id}(id=${upCoursework.getId()})}"
       class="btn btn-secondary back-button">
        <i class="fas fa-arrow-left"></i>
    </a>

    <!-- Форма редактирования тура -->
    <div class="card p-4 mb-4">
        <h2 class="card-title mb-4">Редактирование тура</h2>
        <form th:method="POST" th:action="@{/coursework/edit/{id}(id=${upCoursework.getId()})}"
              th:object="${upCoursework}"
              enctype="multipart/form-data">
            <div class="mb-3">
                <label for="title" class="form-label">Название</label>
                <input type="text" th:field="*{title}" id="title" class="form-control">
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Описание</label>
                <textarea th:field="*{description}" id="description" class="form-control"></textarea>
            </div>
            <div class="mb-3">
                <label for="price" class="form-label">Цена</label>
                <input type="text" th:field="*{price}" id="price" class="form-control">
            </div>
            <div>
                <div class="mb-3">
                    <label for="newImage" class="form-label">Добавить новые фотографии</label>
                    <input type="file" id="newImage" name="newImage" multiple class="form-control">
                </div>
                <div>
                    <button type="submit" class="btn btn-success btn-custom">
                        <i class="fas fa-save"></i> Сохранить изменения
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- Галерея изображений -->
    <div class="card p-4 mb-4">
        <h3 class="card-title mb-4">Фотографии</h3>
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="img-thumbnail">
                    <img th:src="@{/images/coursework/{filename}(filename=${upCoursework.getImage()})}"
                         class="fixed-size-image"
                         data-bs-toggle="modal"
                         data-bs-target="#imageModal"
                         th:attr="data-bs-image-src=@{/images/tour/{filename}(filename=${upCoursework.getImage()})}">
                </div>
            </div>
        </div>
    </div>

    <!-- Кнопка "Вернуться на главную" -->
    <div>
        <a th:href="@{/coursework}" class="btn btn-secondary btn-custom">
            <i class="fas fa-home"></i> Вернуться на главную
        </a>
    </div>

    <!-- Модальное окно для изображений -->
    <div th:insert="~{openingImage.html}"></div>
</div>

<div th:insert="~{savingPosition.html}"></div>

<!-- Подключение Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
