<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Клиенты</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/styles.css">
</head>
<body>

<div th:replace="navbar.html"></div>

<h1>Не опубликованные отзывы</h1>

<table class="table">
    <thead>
    <tr>
        <th>Отзыв</th>
        <th>Имя</th>
        <th>Телефон</th>
        <th>Настоящий</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="feedbackRealty : ${feedbacksRealty}">
        <td th:text="${feedbackRealty.text}"></td>
        <td th:text="${feedbackRealty.user.username}"></td>
        <td th:text="${feedbackRealty.user.phone}"></td>
        <div th:each="activePhone : ${listPhone}">
            <div th:if="${feedbackRealty.user.phone} == activePhone">
                <td th:text="+"></td>
            </div>
        </div>
        <td>
            <a th:href="@{/realty/admin/client/edit/{id}(id=${client.id})}" class="btn btn-warning">Редактировать</a>

            <form th:method="DELETE" th:action="@{/realty/admin/client/{id}(id=${client.id})}" style="display: inline;"
                  onsubmit="return confirm('Вы уверены, что хотите удалить этого клиента?');">
                <button type="submit" class="btn btn-danger">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<a th:href="@{/realty/admin/client/new}" class="btn btn-primary">Добавить нового клиента</a>

</body>
</html>
