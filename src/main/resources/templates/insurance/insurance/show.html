<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <!--    CSRF    -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta charset="UTF-8">
    <title>Тур</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .fixed-size-image {
            width: 100%;
            height: 300px;
            object-fit: contain;
            border-radius: 8px;
            background-color: #f8f9fa;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .fixed-size-image:hover {
            transform: scale(1.03);
        }
        .modal-image {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            margin: 0 auto;
        }
        .modal-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
        }
        .modal-arrow:hover {
            background-color: rgba(0, 0, 0, 0.7);
        }
        .modal-arrow-left {
            left: 10px;
        }
        .modal-arrow-right {
            right: 10px;
        }
        .card {
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .card-body {
            padding: 2rem;
        }
        .btn-custom {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #4361ee;
            border-color: #4361ee;
        }
        .btn-primary:hover {
            background-color: #3a56d4;
            border-color: #3a56d4;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background-color: #6c757d;
            border-color: #6c757d;
        }
        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }
        .consultation-btn {
            background-color: #28a745;
            border-color: #28a745;
            font-size: 1.1rem;
            padding: 12px 24px;
        }
        .consultation-btn:hover {
            background-color: #218838;
            border-color: #218838;
        }
        .alert-message {
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .image-container {
            margin-bottom: 30px;
            border-radius: 12px;
            overflow: hidden;
        }
        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .price-tag {
            font-size: 1.5rem;
            font-weight: 700;
            color: #28a745;
            margin: 15px 0;
        }
        .description-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #495057;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>
<div class="container py-4">
    <!-- Навигационная панель -->
    <div th:insert="~{navbar.html}"></div>

    <!-- Карточка тура -->
    <div class="card p-0 mb-4">
        <div class="card-body">
            <h2 class="card-title mb-3" th:text="${insurance.title}"></h2>
            <p class="description-text" th:text="${insurance.description}"></p>
            <div class="price-tag" th:text="${insurance.price + ' руб.'}"></div>

            <!-- Галерея изображений -->
            <div class="image-container">
                <div class="img-thumbnail p-2">
                    <img th:src="@{/images/insurance/{filename}(filename=${insurance.getImage()})}"
                         class="fixed-size-image"
                         data-bs-toggle="modal"
                         data-bs-target="#imageModal"
                         th:attr="data-bs-image-src=@{{filename}(filename=${insurance.getImage()})}"
                         onclick="openImageModal(event)">
                </div>
            </div>

            <!-- Кнопки действий -->
            <div class="action-buttons">
                <div th:if="${checkAdmin}">
                    <a th:href="@{/insurance/edit/{id}(id=${insurance.getId()})}"
                       class="btn btn-primary btn-custom">
                        <i class="fas fa-edit me-2"></i> Редактировать
                    </a>
                    <form th:method="POST" th:action="@{/insurance/delete/{id}(id=${insurance.getId()})}"
                          onsubmit="return confirm('Вы уверены, что хотите удалить это объявление?');">
                        <button type="submit" class="btn btn-danger btn-custom">
                            <i class="fas fa-trash-alt me-2"></i> Удалить
                        </button>
                    </form>
                </div>
                <a th:href="@{/insurance}" class="btn btn-secondary btn-custom">
                    <i class="fas fa-arrow-left me-2"></i> На главную
                </a>
            </div>
        </div>
    </div>

    <!-- Модальное окно для изображений -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-body text-center">
                    <img id="modalImage" src="" class="modal-image" alt="Изображение">
                </div>
                <!-- Стрелки для переключения -->
                <button class="modal-arrow modal-arrow-left" onclick="changeImage(-1)">&#10094;</button>
                <button class="modal-arrow modal-arrow-right" onclick="changeImage(1)">&#10095;</button>
            </div>
        </div>
    </div>
</div>

<!-- Подключение Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let currentImageIndex = 0;
    const images = [];

    function openImageModal(event) {
        const imageIndex = event.target.getAttribute('data-bs-image-index');
        currentImageIndex = parseInt(imageIndex);
        updateModalImage();
        new bootstrap.Modal(document.getElementById('imageModal')).show();
    }

    function updateModalImage() {
        const modalImage = document.getElementById('modalImage');
        modalImage.src = images[currentImageIndex];
    }

    function changeImage(direction) {
        currentImageIndex += direction;
        if (currentImageIndex < 0) {
            currentImageIndex = images.length - 1;
        } else if (currentImageIndex >= images.length) {
            currentImageIndex = 0;
        }
        updateModalImage();
    }

    document.addEventListener('DOMContentLoaded', () => {
        // Инициализация изображений для галереи
        const imageElements = document.querySelectorAll('.fixed-size-image');
        imageElements.forEach(img => {
            images.push(img.src);
        });

    });
</script>
</body>
</html>
