<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <!--    CSRF    -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta charset="UTF-8">
    <title>Бронирование экскурсии</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4895ef;
            --success-color: #4cc9f0;
        }

        body {
            background-color: #f8f9fa;
        }

        .booking-card {
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border: none;
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 1.5rem;
        }

        .card-title {
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .card-subtitle {
            font-weight: 400;
            opacity: 0.9;
        }

        .price-badge {
            background-color: var(--success-color);
            color: white;
            font-size: 1.25rem;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            display: inline-block;
            margin-top: 0.5rem;
        }

        .form-label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #495057;
        }

        .form-control, .form-select {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.25rem rgba(67, 97, 238, 0.25);
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
            transform: translateY(-2px);
        }

        .btn-secondary {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
        }

        .input-group-text {
            background-color: #f1f3f5;
            border-radius: 8px 0 0 8px;
            font-weight: 500;
        }

        .alert {
            border-radius: 8px;
        }

        .time-slot-container {
            background-color: #f8f9fa;
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 1.5rem;
        }

        .flatpickr-input {
            background-color: white;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div th:insert="~{navbar.html}"></div>

    <div class="booking-card card p-0 mb-4">
        <div class="card-header">
            <h2 class="card-title mb-2" th:text="${tour.title}"></h2>
            <h4 class="card-subtitle mb-3" th:text="${tour.description}"></h4>
            <div class="price-badge">
                <i class="bi bi-tag-fill me-2"></i>
                <span th:text="${tour.price + ' руб.'}"></span>
            </div>
        </div>

        <div class="card-body p-4">
            <!-- Форма для выбора даты -->
            <form th:action="@{/excursion/booking/{tourId}(tourId=${tour.id})}" method="get">
                <div class="mb-4">
                    <label for="date" class="form-label">
                        <i class="bi bi-calendar3 me-2"></i>Выберите дату:
                    </label>
                    <input type="text" class="form-control flatpickr-input" id="date" name="date" required
                           th:value="${selectedDate != null ? #temporals.format(selectedDate, 'yyyy-MM-dd') : ''}"
                           placeholder="Выберите дату">
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-clock me-2"></i>Показать доступное время
                </button>
            </form>

            <!-- Выпадающий список для выбора времени -->
            <div th:if="${selectedDate != null}">
                <div th:if="${noSlotsAvailable}" class="alert alert-warning mt-4">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    На выбранную дату свободных слотов нет.
                </div>

                <div th:unless="${noSlotsAvailable}" class="time-slot-container">
                    <form th:action="@{/excursion/booking/{tourId}(tourId=${tour.id})}" method="post">
                        <div class="mb-4">
                            <label for="bookingTime" class="form-label">
                                <i class="bi bi-clock me-2"></i>Выберите время:
                            </label>
                            <select class="form-select" id="bookingTime" name="bookingTime" required>
                                <option value="" selected disabled>-- Выберите время --</option>
                                <option th:each="slot : ${availableSlots}"
                                        th:value="${#temporals.format(slot, 'yyyy-MM-dd''T''HH:mm')}"
                                        th:text="${#temporals.format(slot, 'HH:mm')}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="phoneNumber" class="form-label">
                                <i class="bi bi-telephone-fill me-2"></i>Номер телефона:
                            </label>
                            <div class="input-group">
                                <span class="input-group-text">+7</span>
                                <input type="text" id="phoneNumber" name="phoneNumber" class="form-control"
                                       placeholder="XXX-XXX-XXXX" maxlength="10" pattern="\d{10}" required>
                            </div>
                            <small class="text-muted">Формат: 9123456789 (без +7)</small>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-3">
                            <i class="bi bi-check-circle-fill me-2"></i>Забронировать
                        </button>
                    </form>
                </div>
            </div>

            <!-- Сообщение об ошибке -->
            <div th:if="${error}" class="alert alert-danger mt-4">
                <i class="bi bi-exclamation-octagon-fill me-2"></i>
                <span th:text="${error}"></span>
            </div>

            <!-- Кнопка "Назад" -->
            <a th:href="@{/excursion/tour/{id}(id=${tour.id})}" class="btn btn-secondary w-100 mt-3">
                <i class="bi bi-arrow-left me-2"></i>Назад к экскурсии
            </a>
        </div>
    </div>
</div>

<!-- Подключение Flatpickr -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {

        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);

        // Инициализация flatpickr с русской локализацией
        flatpickr("#date", {
            minDate: tomorrow,
            dateFormat: "Y-m-d",
            allowInput: true,
            clickOpens: true,
            locale: "ru",
            disableMobile: "true"
        });

        // Обработка номера телефона
        const phoneInput = document.getElementById('phoneNumber');

        phoneInput.addEventListener('input', function (event) {
            this.value = this.value.replace(/\D/g, ''); // Удаляем всё, кроме цифр
            if (this.value.length > 10) {
                this.value = this.value.slice(0, 10); // Ограничиваем до 10 цифр
            }
        });

        // Добавляем +7 перед отправкой
        document.querySelector('form').addEventListener('submit', function (event) {
            if (phoneInput.value && !phoneInput.value.startsWith('+7')) {
                phoneInput.value = '+7' + phoneInput.value;
            }
        });
    });
</script>
</body>
</html>
