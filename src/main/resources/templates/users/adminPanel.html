<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <!--    CSRF    -->
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Административная панель</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .admin-card {
      transition: all 0.3s ease;
      border-radius: 15px;
      overflow: hidden;
      border: none;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      height: 100%;
    }
    .admin-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15);
    }
    .card-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    .card-title {
      font-weight: 600;
      font-size: 1.25rem;
    }
    .admin-header {
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      color: white;
      border-radius: 0 0 20px 20px;
    }
    .btn-logout {
      border: 2px solid white;
      color: white;
      background: transparent;
    }
    .btn-logout:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
<!-- Шапка админки -->
<header class="admin-header py-4 mb-5">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center">
      <h1 class="m-0">
        <i class="fas fa-user-shield me-2"></i>Административная панель
      </h1>
      <form th:action="@{/realty}" method="get">
        <button type="submit" class="btn btn-logout">
          <i class="fas fa-sign-out-alt me-1"></i> Назад
        </button>
      </form>
    </div>
  </div>
</header>

<!-- Основной контент -->
<main class="container">
  <div class="row g-4">
    <!-- Карточка клиентов -->
    <div class="col-md-6 col-lg-3">
      <a th:href="@{/admin/client}" class="text-decoration-none">
        <div class="card admin-card text-center py-4">
          <div class="card-body">
            <div class="card-icon text-primary">
              <i class="fas fa-users"></i>
            </div>
            <h3 class="card-title">Клиенты</h3>
            <p class="text-muted">Управление базой клиентов</p>
          </div>
        </div>
      </a>
    </div>

    <!-- Карточка пользователей -->
    <div class="col-md-6 col-lg-3">
      <a th:href="@{/admin/users}" class="text-decoration-none">
        <div class="card admin-card text-center py-4">
          <div class="card-body">
            <div class="card-icon text-success">
              <i class="fas fa-user-cog"></i>
            </div>
            <h3 class="card-title">Пользователи</h3>
            <p class="text-muted">Управление учетными записями</p>
          </div>
        </div>
      </a>
    </div>

    <!-- Карточка отзывов -->
    <div class="col-md-6 col-lg-3">
      <a th:href="@{/admin/feedback}" class="text-decoration-none">
        <div class="card admin-card text-center py-4">
          <div class="card-body">
            <div class="card-icon text-warning">
              <i class="fas fa-comment-dots"></i>
            </div>
            <h3 class="card-title">Отзывы</h3>
            <p class="text-muted">Модерация отзывов</p>
          </div>
        </div>
      </a>
    </div>

    <!-- Карточка бронирований -->
    <div class="col-md-6 col-lg-3">
      <a th:href="@{/admin/booking}" class="text-decoration-none">
        <div class="card admin-card text-center py-4">
          <div class="card-body">
            <div class="card-icon text-danger">
              <i class="fas fa-calendar-check"></i>
            </div>
            <h3 class="card-title">Бронирования</h3>
            <p class="text-muted">Управление записями</p>
          </div>
        </div>
      </a>
    </div>
  </div>

</main>

<!-- Подвал -->
<footer class="mt-5 py-3 bg-light">
  <div class="container text-center text-muted">
    <small>Административная панель © 2025</small>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
