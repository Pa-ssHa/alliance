<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!--    CSRF    -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta charset="UTF-8">
    <title>Восстановление пароля</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5" style="max-width: 500px;">
    <h2 class="mb-4">Восстановление пароля</h2>

    <!-- Ошибки -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/reset-password}" method="post">

        <!-- Email -->
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>

        <!-- Имя (дополнительная проверка) -->
        <div class="mb-3">
            <label class="form-label">Ваше имя</label>
            <input type="text" name="name" class="form-control" required>
        </div>

        <!-- Новый пароль -->
        <div class="mb-3">
            <label class="form-label">Новый пароль</label>
            <input type="password" name="newPassword" class="form-control" required
                   minlength="6"
                   title="Минимум 6 символов, буквы и цифры">

<!--            pattern="^(?=.*[A-Za-z])(?=.*\d).{8,}$"-->
        </div>

        <!-- Подтверждение пароля -->
        <div class="mb-3">
            <label class="form-label">Повторите пароль</label>
            <input type="password" name="confirmPassword" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Сменить пароль</button>
    </form>
</div>
</body>
</html>
