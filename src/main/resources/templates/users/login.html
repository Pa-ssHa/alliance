<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <!-- Подключаем Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 600px;
            margin-top: 50px;
        }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background-color: #007bff;
            color: white;
            border-radius: 10px 10px 0 0;
        }
        .btn-primary {
            background-color: #007bff;
            border: none;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .form-control {
            border-radius: 5px;
        }
        .alert {
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header text-center">
            <h2>Вход</h2>
        </div>
        <div class="card-body">
            <!-- Сообщение об ошибке -->
            <div th:if="${param.error}" class="alert alert-danger">
                Неверное имя пользователя или пароль.
            </div>

            <!-- Форма входа -->
<!--            <form th:action="@{/login}" method="post" >-->
            <form id="loginForm">
                <div class="mb-3">
                    <label for="phone" class="form-label">Телефон:</label>
                    <input type="text" class="form-control" id="phone" name="phone" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Пароль:</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>

            <button id="reset-password-btn" class="btn btn-warning w-100">Сменить пароль</button>

            <!-- Ссылка на регистрацию -->
            <div class="text-center mt-3">
                <a th:href="@{/registration}" class="btn btn-link">Нет аккаунта? Зарегистрироваться</a>
            </div>
        </div>
    </div>
</div>

<!-- Подключаем Bootstrap JS -->
<script>

    document.getElementById("loginForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const phoneNumber = document.getElementById("phone").value;
        const password = document.getElementById("password").value;

        const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ phoneNumber, password })
        });

        if (response.ok) {
            window.location.href = "/realty"; // перенаправление после успешного входа
        } else {
            alert("Ошибка входа! Проверьте телефон и пароль.");
        }
    });

    // смена пароля
    document.getElementById("reset-password-btn").addEventListener("click", function() {
        const phoneNumber = document.getElementById("phone").value; // Берем номер из поля
        const appVerifier = new firebase.auth.RecaptchaVerifier('reset-password-btn', {
            size: 'invisible'
        });

        firebase.auth().signInWithPhoneNumber(phoneNumber, appVerifier)
            .then(confirmationResult => {
                const code = prompt("Введите код из SMS:");
                return confirmationResult.confirm(code);
            })
            .then(userCredential => {
                Swal.fire({
                    title: "Пароль сброшен!",
                    text: "Теперь введите новый пароль.",
                    input: "password",
                    inputPlaceholder: "Введите новый пароль",
                    confirmButtonText: "Сохранить"
                }).then(result => {
                    if (result.value) {
                        userCredential.user.updatePassword(result.value)
                            .then(() => Swal.fire("Готово!", "Пароль успешно изменен!", "success"))
                            .catch(error => Swal.fire("Ошибка", error.message, "error"));
                    }
                });
            })
            .catch(error => Swal.fire("Ошибка", error.message, "error"));
    });

</script>
</body>
</html>
