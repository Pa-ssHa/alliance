<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <!--    CSRF    -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta charset="UTF-8">
    <title>Пользователи</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/styles.css">
</head>
<body>

<div th:replace="navbar.html"></div>

<h1>Список пользователей</h1>

<table class="table">
    <thead>
    <tr>
        <th>Имя</th>
        <th>Телефон</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.name}"></td>
        <td th:text="${user.phone}"></td>
        <td>
<!--            <a th:href="@{/realty/admin/client/edit/{id}(id=${user.id})}" class="btn btn-warning">Редактировать</a>-->

            <form th:method="DELETE" th:action="@{/admin/users/{id}(id=${user.id})}" style="display: inline;"
                  onsubmit="return confirm('Вы уверены, что хотите удалить этого клиента?');">
                <button type="submit" class="btn btn-danger">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<!--<a th:href="@{/realty/admin/client/new}" class="btn btn-primary">Добавить нового клиента</a>-->

</body>
</html>
